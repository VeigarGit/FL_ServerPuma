
x-client-template: &client
  build:
    context: .
    dockerfile: dockerfile.client
    args:
      - NO_CACHE=true
  image: fl-client-image
  restart: 'no'
  working_dir: /app/src/system
  environment: 
    - PYTHONUNBUFFERED=1
    - PYTHONPATH=/app/src/system:/app/src
  volumes:
    - ./src/dataset:/app/src/dataset
    - ./src/results:/app/src/results
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]
  depends_on:
    - server
  networks:
    - docker-tc
  labels:
    - "com.docker-tc.enabled=1"
    - "com.docker-tc.loss=10%"

services:
  server:
    build:
      context: .
      dockerfile: dockerfile.server
      args:
        - NO_CACHE=true
    container_name: fl-server
    restart: 'no'
    working_dir: /app/src/system
    environment: 
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/src/system:/app/src
    volumes:
      - ./src/dataset:/app/src/dataset
      - ./src/results:/app/src/results
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "9090:9090"
    command: ["python", "server.py", "--dataset", "Cifar100", "--clients-per-round", "5", "--rounds", "10", "--prune", "1"]
    networks:
      - docker-tc
    labels:
      - "com.docker-tc.enabled=1"
      - "com.docker-tc.limit=1mbit"
      - "com.docker-tc.delay=100ms"

  client-0:
    <<: *client
    container_name: fl-client-0
    command: ["python", "client.py", "--client-idx", "0", "--host", "fl-server", "--dataset", "Cifar100", "--rounds", "10", "--ala", "0"]

  client-1:
    <<: *client
    container_name: fl-client-1
    command: ["python", "client.py", "--client-idx", "1", "--host", "fl-server", "--dataset", "Cifar100", "--rounds", "10", "--ala", "0"]

  client-2:
    <<: *client
    container_name: fl-client-2
    command: ["python", "client.py", "--client-idx", "2", "--host", "fl-server", "--dataset", "Cifar100", "--rounds", "10", "--ala", "0"]

  client-3:
    <<: *client
    container_name: fl-client-3
    command: ["python", "client.py", "--client-idx", "3", "--host", "fl-server", "--dataset", "Cifar100", "--rounds", "10", "--ala", "0"]

  client-4:
    <<: *client
    container_name: fl-client-4
    command: ["python", "client.py", "--client-idx", "4", "--host", "fl-server", "--dataset", "Cifar100", "--rounds", "10", "--ala", "0"]

networks:
  docker-tc:
    driver: bridge
