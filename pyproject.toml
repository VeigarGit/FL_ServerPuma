[build-system]
# Desvincula o empacotamento do setuptools arcaico
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fl-serverpuma"
version = "0.1.0"
description = "Adaptive Federated Learning Simulator"
# Baseado no seu env do Conda
requires-python = "==3.11.*"
dependencies = [
    # Core scientific computing
    "numpy<2",
    "pandas",
    "scikit-learn",
    "scipy",
    "ujson",
    "h5py",
    # Visualization
    "seaborn",
    "matplotlib",
    # Utilities
    "click",
    "calmsize",
    "memory-profiler",
    "portalocker",
    "tqdm",
    "cmake<4.0.0",  # <--- A vacina contra o erro de compilação do Triton/PyTorch
    # PyTorch ecosystem (Mantendo a versão travada)
    "torchtext",
    # Advanced ML
    "cvxpy",
    "higher",
    "diffusers",
    "accelerate",
    "transformers>=4.49.0",
    "datasets>=4.8.5",
    "pyyaml>=6.0.3",
    "peft>=0.19.1",
    "pillow>=12.1.1",
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "torchaudio>=2.1.0",
    "traci>=1.27.1",
    "sumolib>=1.27.1",
    "qwen-vl-utils[decord]>=0.0.14",
]

[tool.ruff]
# Configuração base do linter ultrarrápido Ruff
line-length = 99
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
torchaudio = { index = "pytorch" }
[tool.hatch.build.targets.wheel]
packages = ["src/system", "src/dataset", "src/utils"]
